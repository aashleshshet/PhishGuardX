services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: phishguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishguard -d phishguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://phishguard:${POSTGRES_PASSWORD}@database:5432/phishguard
    depends_on:
      database:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres-data:
